merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - "label=auto-merge"
      - "check-success=build"

pull_request_rules:
  - name: Auto-Merge
    description: Merge branch once conditions pass
    conditions:
      - "label=auto-merge"
      - "status-success=build"
      - "#approved-reviews-by>=1"
      - "-conflict"
      - "title~=^((?!(wip|WIP)).)*$"
    actions:
      queue:
        name: default

